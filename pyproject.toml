[tool.ruff]
target-version = "py311"
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These scripts add tools/ to sys.path before importing standalone modules.
"experiments/*.py" = ["E402"]
"tests/test_asr_comparison.py" = ["E402"]
"tests/test_prepare_episode.py" = ["E402"]

[tool.pyright]
include = ["**/*.py"]
exclude = ["local", ".venv", "node_modules", "**/__pycache__"]
extraPaths = ["tools", "experiments"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
