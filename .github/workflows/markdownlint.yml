name: Markdown documentation lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lint-markdown.mjs'
      - '.github/workflows/markdownlint.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lint-markdown.mjs'
      - '.github/workflows/markdownlint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint maintained Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation linter
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Markdown
        run: npm run lint:markdown
      - name: Audit Markdown tooling dependencies
        run: npm audit --audit-level=low
